    <body>
  <section class="publication-section">
  <style>
    html, body {
      /* height: 100%; */
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
    min-height: 100vh;
      margin: 0;
      padding: 0;
      background: #fff;
    }
    .publication-section {
      padding: 0.5rem 0;
      background: #fff;
      border-radius: 12px;
      max-width: 1000px;
      margin: 0 auto;
      /* box-shadow: 0 2px 8px rgba(0,0,0,0.04); */
    }
    .publication-links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      margin: 0;
    }
    .link-block {
      display: flex;
    }
    .external-link.button {
      display: flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.75em 1.5em;
      font-size: 1rem;
      border: none;
      border-radius: 2em;
      background: #222;
      color: #fff;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .external-link.button:hover,
    .external-link.button:focus {
      background: #444;
      transform: translateY(-2px) scale(1.03);
      color: #fff;
      text-decoration: none;
    }
    .external-link .icon {
      display: flex;
      align-items: center;
      font-size: 1.2em;
    }
    @media (max-width: 600px) {
      .publication-links {
        flex-direction: column;
        gap: 0.75rem;
      }
      .external-link.button {
        width: 100%;
        justify-content: center;
        font-size: 1.05rem;
      }
    }
  </style>
  <script>
    // Optional: Add ripple effect to buttons for better UX
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.external-link.button').forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          let ripple = document.createElement('span');
          ripple.className = 'ripple';
          ripple.style.left = (e.offsetX) + 'px';
          ripple.style.top = (e.offsetY) + 'px';
          this.appendChild(ripple);
          setTimeout(() => ripple.remove(), 600);
        });
      });
    });
  </script>
  <style>
    /* Ripple effect styles */
    .external-link.button {
      position: relative;
      overflow: hidden;
    }
    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: ripple 0.6s linear;
      background-color: rgba(255,255,255,0.4);
      pointer-events: none;
      width: 100px;
      height: 100px;
      opacity: 0.7;
      z-index: 1;
    }
    @keyframes ripple {
      to {
        transform: scale(2.5);
        opacity: 0;
      }
    }
  </style>
